<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zahlensystem-Trainer</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=calculate,add,shuffle&display=block">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">

            <div class="header-icon">
                <span class="material-symbols-outlined">calculate</span>
            </div>

            <div>
                <h1>Zahlensystem-Trainer</h1>

                <p>
                    Übe Binär-, Dezimal- und Hexadezimalzahlen
                    und lerne, verschiedene Zahlensysteme zu addieren.
                </p>
            </div>

        </header>


        <!-- MENÜ -->

        <section id="menu">

            <div class="section-heading">

                <span class="section-label">TRAINING</span>

                <h2>Übungsmodus wählen</h2>

                <p>
                    Wähle eine Aufgabe und starte direkt mit dem Training.
                </p>

            </div>


            <div class="mode-grid">

                <!-- Dezimal → Binär -->

                <button class="mode-button" data-mode="decimal-binary">

                    <span class="mode-main">

                        <span class="mode-system">
                            Dezimal
                        </span>

                        <span class="mode-arrow">
                            →
                        </span>

                        <span class="mode-system">
                            Binär
                        </span>

                    </span>

                    <span class="mode-description">
                        Basis 10 → Basis 2
                    </span>

                </button>


                <!-- Binär → Dezimal -->

                <button class="mode-button" data-mode="binary-decimal">

                    <span class="mode-main">

                        <span class="mode-system">
                            Binär
                        </span>

                        <span class="mode-arrow">
                            →
                        </span>

                        <span class="mode-system">
                            Dezimal
                        </span>

                    </span>

                    <span class="mode-description">
                        Basis 2 → Basis 10
                    </span>

                </button>


                <!-- Dezimal → Hexadezimal -->

                <button class="mode-button" data-mode="decimal-hex">

                    <span class="mode-main">

                        <span class="mode-system">
                            Dezimal
                        </span>

                        <span class="mode-arrow">
                            →
                        </span>

                        <span class="mode-system">
                            Hexadezimal
                        </span>

                    </span>

                    <span class="mode-description">
                        Basis 10 → Basis 16
                    </span>

                </button>


                <!-- Hexadezimal → Dezimal -->

                <button class="mode-button" data-mode="hex-decimal">

                    <span class="mode-main">

                        <span class="mode-system">
                            Hexadezimal
                        </span>

                        <span class="mode-arrow">
                            →
                        </span>

                        <span class="mode-system">
                            Dezimal
                        </span>

                    </span>

                    <span class="mode-description">
                        Basis 16 → Basis 10
                    </span>

                </button>


                <!-- Binär → Hexadezimal -->

                <button class="mode-button" data-mode="binary-hex">

                    <span class="mode-main">

                        <span class="mode-system">
                            Binär
                        </span>

                        <span class="mode-arrow">
                            →
                        </span>

                        <span class="mode-system">
                            Hexadezimal
                        </span>

                    </span>

                    <span class="mode-description">
                        Basis 2 → Basis 16
                    </span>

                </button>


                <!-- Hexadezimal → Binär -->

                <button class="mode-button" data-mode="hex-binary">

                    <span class="mode-main">

                        <span class="mode-system">
                            Hexadezimal
                        </span>

                        <span class="mode-arrow">
                            →
                        </span>

                        <span class="mode-system">
                            Binär
                        </span>

                    </span>

                    <span class="mode-description">
                        Basis 16 → Basis 2
                    </span>

                </button>


                <!-- Addition -->

                <button class="mode-button mode-addition" data-mode="number-addition">

                    <span class="mode-icon">
                        <span class="material-symbols-outlined">
                            add
                        </span>
                    </span>

                    <span class="mode-content">

                        <span class="mode-main">
                            Zahlensysteme addieren
                        </span>

                        <span class="mode-description">
                            Zahlen verschiedener Basen zusammenrechnen
                        </span>

                    </span>

                </button>


                <!-- Gemischt -->

                <button class="mode-button mode-mixed" data-mode="mixed">

                    <span class="mode-icon">
                        <span class="material-symbols-outlined">
                            shuffle
                        </span>
                    </span>

                    <span class="mode-content">

                        <span class="mode-main">
                            Gemischte Aufgaben
                        </span>

                        <span class="mode-description">
                            Alle Übungsarten kombiniert
                        </span>

                    </span>

                </button>

            </div>

        </section>


        <!-- TRAINING -->

        <section id="training" class="hidden">

            <div class="top-bar">

                <button id="backButton" class="secondary-button">
                    <span>←</span>
                    Zurück
                </button>

                <div id="score">
                    Aufgabe 1 / 10
                    <span class="score-divider">•</span>
                    Richtig: 0
                </div>

            </div>


            <div class="task-card">

                <div class="task-header">

                    <span id="taskType">
                        Dezimal → Binär
                    </span>

                    <span class="task-number">
                        Aufgabe
                    </span>

                </div>


                <div id="task">

                    <div class="conversion-task">

                        <div class="number-box source-box">

                            <div class="number-box-label">
                                Dezimal
                            </div>

                            <div class="number-box-value">
                                123<span class="base">D</span>
                            </div>

                        </div>

                        <div class="conversion-arrow">
                            →
                        </div>

                        <div class="number-box target-box">

                            <div class="number-box-label">
                                Binär
                            </div>

                            <div class="number-box-value question">
                                ?<span class="base">B</span>
                            </div>

                        </div>

                    </div>

                </div>


                <div class="answer-area">

                    <input type="text" id="answerInput" autocomplete="off" spellcheck="false"
                        placeholder="Deine Antwort">

                    <button id="checkButton">
                        Prüfen
                    </button>

                </div>


                <div id="feedback"></div>


                <button id="solutionButton" class="hidden solution-button">
                    Lösungsweg anzeigen
                </button>


                <div id="solution" class="solution hidden"></div>


                <button id="nextButton" class="hidden next-button">
                    Nächste Aufgabe
                    <span>→</span>
                </button>


                <div id="resultButtons" class="hidden">

                    <button id="restartButton">
                        ↻ Nochmal 10 Aufgaben
                    </button>

                    <button id="menuButton" class="secondary-button">
                        Übungsmodus wechseln
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
